name: E2E Addon Tests (Masterportal LTS)

on:
  push:
    branches: [main, e2e]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      addon:
        description: 'Run tests for a specific addon (leave empty for all)'
        required: false
        default: 'exporter'

env:
  MASTERPORTAL_REPO: https://bitbucket.org/geowerkstatt-hamburg/masterportal
  MASTERPORTAL_TAG: v3.15.2
  SERVE_PORT: 8080
  SERVE_HOST: localhost
  NODE_VERSION: 22.22.3

defaults:
  run:
    shell: bash

jobs:
  # ── 1. Discover addons ────────────────────────────────────────────────────────
  discover-addons:
    name: Discover addons
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git jq

      - name: Checkout masterportal-addons
        uses: actions/checkout@v4
        with:
          path: masterportal-addons

      - name: Build addon matrix
        id: set-matrix
        run: |
          INPUT_ADDON="${{ github.event.inputs.addon }}"

          if [ -n "$INPUT_ADDON" ]; then
            echo "matrix={\"addon\":[\"$INPUT_ADDON\"]}" >> "$GITHUB_OUTPUT"
          else
            addons=$(find masterportal-addons -maxdepth 2 -name "index.js" \
              | sed 's|masterportal-addons/||' \
              | sed 's|/index.js||' \
              | grep -v node_modules \
              | sort -u \
              | jq -Rc '[.,inputs]' \
              | jq -sc '.[0]')

            echo "matrix={\"addon\":$addons}" >> "$GITHUB_OUTPUT"
          fi

          echo "Discovered: $(grep matrix "$GITHUB_OUTPUT")"

  # ── 2. Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build – ${{ matrix.addon }}
    needs: discover-addons
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-addons.outputs.matrix) }}

    steps:
      - name: Debug system resources
        run: |
          free -h
          df -h
          docker info 2>/dev/null || true
          ulimit -a
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            make \
            g++ \
            pkg-config \
            libcairo2-dev \
            libpango1.0-dev \
            libpixman-1-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Checkout masterportal-addons
        uses: actions/checkout@v4
        with:
          path: masterportal-addons

      - name: Clone Masterportal (LTS)
        run: |
          git clone \
            --branch "$MASTERPORTAL_TAG" \
            --depth 1 \
            "$MASTERPORTAL_REPO" \
            masterportal

      - name: Print environment info
        run: |
          echo "Node:  $(node --version)"
          echo "npm:   $(npm --version)"
          echo "nproc: $(nproc)"
          free -h || true

      - name: Install Masterportal dependencies
        working-directory: masterportal
        env:
          npm_config_build_from_source: 'false'
        run: npm ci --ignore-scripts

      - name: Copy addon into masterportal/addons/
        run: |
          ADDON="${{ matrix.addon }}"
          ADDON_SRC="masterportal-addons/$ADDON"
          ADDON_DEST="masterportal/addons/$ADDON"

          if [ ! -d "$ADDON_SRC" ]; then
            echo "::error::Addon directory not found: $ADDON_SRC"
            exit 1
          fi

          mkdir -p masterportal/addons
          cp -r "$ADDON_SRC" "$ADDON_DEST"

          echo "Copied $ADDON_SRC -> $ADDON_DEST"

          if [ -f "$ADDON_DEST/package.json" ]; then
            echo "Installing addon-specific dependencies..."
            (cd masterportal && npm install --legacy-peer-deps --ignore-scripts)
          fi

      - name: Patch addonsConf.json
        working-directory: masterportal-addons
        run: |
          node scripts/patch-addons-conf.js \
            --masterportal ../masterportal \
            --addon "${{ matrix.addon }}"

      - name: Build Masterportal
        working-directory: masterportal
        env:
          NODE_OPTIONS: '--max-old-space-size=3072'
        run: |
          set -x
          npm run build

      - name: Show build output layout
        run: |
          echo "── masterportal/dist/ ──────────────────────────────"
          find masterportal/dist -maxdepth 3 | head -60
          echo "────────────────────────────────────────────────────"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: masterportal-dist-${{ matrix.addon }}
          path: masterportal/dist/
          retention-days: 1

  # ── 3. Test ───────────────────────────────────────────────────────────────────
  test:
    name: Test – ${{ matrix.addon }}
    needs: [discover-addons, build]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-addons.outputs.matrix) }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Chromium + Playwright dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            jq \
            chromium-browser \
            ca-certificates \
            fonts-freefont-ttf \
            fonts-noto-color-emoji

          echo "PLAYWRIGHT_BROWSERS_PATH=0" >> "$GITHUB_ENV"

          CHROMIUM_PATH=$(which chromium-browser || which chromium)

          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$CHROMIUM_PATH" \
            >> "$GITHUB_ENV"

      - name: Checkout masterportal-addons
        uses: actions/checkout@v4
        with:
          path: masterportal-addons

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: masterportal-dist-${{ matrix.addon }}
          path: masterportal-dist

      - name: Install Playwright and serve
        working-directory: masterportal-addons
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi

          npm install --save-dev \
            @playwright/test \
            wait-on \
            serve

      - name: Serve built Masterportal
        working-directory: masterportal-addons
        run: |
          npx serve \
            --listen ${{ env.SERVE_PORT }} \
            --no-clipboard \
            --no-port-switching \
            ../masterportal-dist &

          echo "SERVE_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for static server to be ready
        working-directory: masterportal-addons
        run: |
          npx wait-on \
            --timeout 30000 \
            --interval 1000 \
            "http://${{ env.SERVE_HOST }}:${{ env.SERVE_PORT }}"

      - name: Run Playwright E2E tests
        working-directory: masterportal-addons
        env:
          ADDON_NAME: ${{ matrix.addon }}
          BASE_URL: http://${{ env.SERVE_HOST }}:${{ env.SERVE_PORT }}
          DEBUG: 'pw:masterportal'
          PLAYWRIGHT_TRACE: 'on'
        run: |
          npx playwright test \
            --config=playwright.config.js \
            --reporter=list \
            tests/e2e/

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.addon }}
          path: masterportal-addons/playwright-report/
          retention-days: 14

      - name: Stop static server
        if: always()
        run: |
          if [ -n "$SERVE_PID" ]; then
            kill "$SERVE_PID" || true
          fi
